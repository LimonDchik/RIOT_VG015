proc init_targets {} {

  reset_config trst_and_srst

  jtag newtap riscv cpu -irlen 5 -ircapture 1 -irmask 0x1f -expected-id 0xdeb11001

  jtag newtap riscv sys -irlen 4 -ircapture 5 -irmask 0x0f -enable -expected-id 0xfffffffe -ignore-bypass

  target create riscv.cpu riscv -endian little -chain-position riscv.cpu -coreid 0

  riscv hide_csrs 1-767,770,771,774-831,837-1951,1955,1957-1967,1971-2015,2017-2815,2817,2819-2943,2945,2947-3071,3075-3199,3203-3856,3861-4095
  
}

poll_period 200

init

riscv.cpu arm semihosting enable
